<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Marketplace - TaskForge</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* Match MVP Theme */
        :root {
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-color: #1E293B;
            --accent-color: #06B6D4;
            --accent-secondary: #8B5CF6;
            --accent-hover: #22D3EE;
            --success-color: #10B981;
            --danger-color: #EF4444;
            --border-color: #CBD5E1;
            --input-bg: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navbar - Match Home Page */
        .navbar {
            background: #000000;
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(6, 182, 212, 0.5);
            backdrop-filter: blur(5px);
            height: 56px;
        }

        .navbar-brand-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        .navbar-brand-clickable {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-secondary);
        }

        .nav-links a.active {
            color: var(--accent-color);
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 3rem;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--text-color);
            opacity: 0.8;
        }

        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* Sidebar */
        .sidebar {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            height: fit-content;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .sidebar h3 {
            color: var(--accent-color);
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-section label {
            display: block;
            color: var(--text-color);
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .filter-section input,
        .filter-section select {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }

        .filter-section input:focus,
        .filter-section select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--text-color);
            flex: 1;
            box-shadow: 0 4px 10px rgba(6, 182, 212, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-color);
            flex: 1;
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        /* Instances Section */
        .instances-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .results-count {
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-controls label {
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .sort-controls select {
            padding: 8px 12px;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        /* Instance Cards */
        .instance-card {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .instance-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2);
        }

        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .gpu-badge {
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(6, 182, 212, 0.3);
        }

        .instance-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .status-indicator.online {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .status-indicator.idle {
            background: #F59E0B;
            box-shadow: 0 0 10px #F59E0B;
        }

        .status-indicator.busy {
            background: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
        }

        .status-text {
            color: var(--text-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .instance-specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spec-label {
            color: var(--accent-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .spec-value {
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
        }

        .instance-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 2px solid var(--border-color);
        }

        .instance-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stars {
            color: #F59E0B;
            font-size: 1.1rem;
        }

        .rating-value {
            color: var(--text-color);
            font-weight: 700;
        }

        .jobs-count {
            color: var(--text-color);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .completion-time {
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .rent-btn {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, #6D28D9 100%);
            color: #FFFFFF;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);
            font-family: 'Orbitron', sans-serif;
        }

        .rent-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(139, 92, 246, 0.6);
        }

        .loading,
        .no-results {
            text-align: center;
            padding: 60px;
            color: var(--text-color);
            font-size: 1.2rem;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .instance-footer {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .rent-btn {
                width: 100%;
            }
        }

        /* Hero Section - Match Lender Dashboard */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: calc(4rem + var(--navbar-height));
            padding-bottom: 4rem;
            background-color: transparent;
            background-attachment: fixed;
            color: var(--text-color);
            position: relative;
            min-height: 90vh;
            border-bottom: 2px solid rgba(6, 182, 212, 0.2);
            overflow: hidden;
            text-align: center;
        }

        .hero-heading {
            font-size: 4.8rem;
            font-weight: 700;
            margin: 0 0 1rem 0;
            padding: 0 20px;
            max-width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .hero-paragraph {
            font-size: 1.25rem;
            max-width: 750px;
            margin: 0 auto 3rem auto;
            line-height: 1.5;
            color: var(--text-color);
            padding: 0 20px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div>
            <span class="navbar-brand-text">TaskForge</span>
        </div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="marketplace.html" class="active">GPU Marketplace</a></li>
            <li><a href="borrower.html">Submit Job</a></li>
            <li><a href="lender.html">Lend GPU</a></li>
            <li><a href="wallet.html" style="color: var(--accent-color); font-weight: 700;">Wallet</a></li>
        </ul>
    </nav>

    <div class="hero-section" style="min-height: 40vh; padding-top: 8rem;">
        <h1 class="hero-heading">GPU Marketplace</h1>
        <p class="hero-paragraph">Find the perfect GPU for your training job</p>
    </div>

    <div class="container">
        <div class="page-header" style="display:none">
            <h1>🖥️ GPU Marketplace</h1>
            <p>Find the perfect GPU for your training job</p>
        </div>

        <div class="main-content">
            <aside class="sidebar">
                <h3>🔍 Filters</h3>

                <div class="filter-section">
                    <label>GPU Model</label>
                    <input type="text" id="gpuFilter" placeholder="RTX 3060, RTX 4090...">
                </div>

                <div class="filter-section">
                    <label>Min VRAM (GB)</label>
                    <input type="number" id="vramFilter" placeholder="8" min="0">
                </div>

                <div class="filter-section">
                    <label>Min RAM (GB)</label>
                    <input type="number" id="ramFilter" placeholder="16" min="0">
                </div>

                <div class="filter-section">
                    <label>Operating System</label>
                    <select id="osFilter">
                        <option value="">Any OS</option>
                        <option value="ubuntu 22">Ubuntu 22.04</option>
                        <option value="ubuntu 20">Ubuntu 20.04</option>
                        <option value="windows">Windows</option>
                    </select>
                </div>

                <div class="filter-section">
                    <label>Availability</label>
                    <select id="statusFilter">
                        <option value="">All Instances</option>
                        <option value="online">Available Now</option>
                        <option value="idle">Idle</option>
                        <option value="busy">Busy</option>
                    </select>
                </div>

                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
                    <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
                </div>
            </aside>

            <main class="instances-section">
                <div class="results-header">
                    <div class="results-count" id="resultsCount">Loading instances...</div>
                    <div class="sort-controls">
                        <label>Sort by:</label>
                        <select id="sortFilter" onchange="applyFilters()">
                            <option value="">Default</option>
                            <option value="rating">Best Rating</option>
                            <option value="jobs">Most Reliable</option>
                            <option value="speed">Fastest GPU</option>
                        </select>
                    </div>
                </div>

                <div id="instancesList">
                    <div class="loading">⏳ Loading GPU instances...</div>
                </div>
            </main>
        </div>
    </div>

    <script>
        async function loadInstances() {
            try {
                const gpu = document.getElementById('gpuFilter').value;
                const vram = document.getElementById('vramFilter').value;
                const ram = document.getElementById('ramFilter').value;
                const os = document.getElementById('osFilter').value;
                const status = document.getElementById('statusFilter').value;
                const sort = document.getElementById('sortFilter').value;

                const params = new URLSearchParams();
                if (gpu) params.append('gpu', gpu);
                if (vram) params.append('vram_min', vram);
                if (os) params.append('os', os);
                if (status) params.append('status', status);
                if (sort) params.append('sort', sort);

                const response = await fetch(`/api/marketplace?${params}`);
                const data = await response.json();

                displayInstances(data.lenders);
                updateResultsCount(data.total);
            } catch (error) {
                console.error('Error loading instances:', error);
                document.getElementById('instancesList').innerHTML = `
                    <div class="no-results">⚠️ Failed to load instances. Please refresh the page.</div>
                `;
            }
        }

        function displayInstances(instances) {
            const container = document.getElementById('instancesList');

            if (instances.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        🔍 No instances found matching your criteria.<br>
                        <small style="opacity: 0.7;">Try adjusting your filters</small>
                    </div>
                `;
                return;
            }

            container.innerHTML = instances.map(instance => `
                <div class="instance-card" onclick="viewInstance('${instance.id}')">
                    <div class="instance-header">
                        <div class="gpu-badge">${instance.gpu}</div>
                        <div class="instance-status">
                            <div class="status-indicator ${instance.status}"></div>
                            <span class="status-text">${instance.status}</span>
                        </div>
                    </div>

                    <div class="instance-specs">
                        <div class="spec-item">
                            <div class="spec-label">VRAM</div>
                            <div class="spec-value">${instance.vram} GB</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">CPU</div>
                            <div class="spec-value">${instance.cpu}</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">RAM</div>
                            <div class="spec-value">${instance.ram} GB</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">OS</div>
                            <div class="spec-value">${instance.os}</div>
                        </div>
                    </div>

                    <div class="instance-footer">
                        <div class="instance-meta">
                            <div class="rating">
                                <span class="stars">⭐</span>
                                <span class="rating-value">${instance.rating.toFixed(1)}</span>
                            </div>
                            <div class="jobs-count">${instance.jobsCompleted} jobs completed</div>
                            <div class="completion-time">⚡ Avg: ${instance.avgCompletionTime}</div>
                        </div>
                        <button class="rent-btn" onclick="rentInstance('${instance.id}'); event.stopPropagation();">
                            Rent Instance
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateResultsCount(count) {
            const text = count === 1 ? '1 instance available' : `${count} instances available`;
            document.getElementById('resultsCount').textContent = text;
        }

        function applyFilters() {
            loadInstances();
        }

        function resetFilters() {
            document.getElementById('gpuFilter').value = '';
            document.getElementById('vramFilter').value = '';
            document.getElementById('ramFilter').value = '';
            document.getElementById('osFilter').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('sortFilter').value = '';
            loadInstances();
        }

        function viewInstance(instanceId) {
            console.log('Viewing instance:', instanceId);
        }

        function rentInstance(instanceId) {
            window.location.href = `/borrower.html?instance=${instanceId}`;
        }

        // Load instances on page load
        loadInstances();
    </script>
</body>

</html>
